# main 브랜치가 바뀔 때마다 gh-pages 브랜치를 main과 똑같이 맞춰서
# GitHub Pages(https://z7j5r9hz2j-ui.github.io/Aisecret/)에 자동 반영한다.
name: Sync gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: |
          # 업데이트 뒤 옛 CSS/JS가 캐시에서 섞여 나오지 않도록 파일 주소에 버전을 붙인다
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html
          # 앱이 새 버전이 나왔는지 확인하는 파일 (update.js)
          echo "{\"version\":\"${GITHUB_SHA::7}\"}" > version.json
          git add version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7}" --allow-empty
          git push --force origin HEAD:refs/heads/gh-pages
