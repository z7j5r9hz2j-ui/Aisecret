[project]
name = "korail-watch"
version = "0.1.0"
description = "코레일+ 빈자리 감시 - 조회와 좌석 선점까지, 결제는 하지 않음"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
korail-watch = "korail_watch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
