<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나만의 가계부</title>
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/xlsx.full.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>나만의 가계부</h1>
    <div class="top-actions">
      <button id="btn-import" class="btn">삼성카드 불러오기</button>
      <button id="btn-add" class="btn primary">+ 지출 입력</button>
    </div>
  </header>

  <div id="export-banner" class="banner" hidden>
    <span id="export-banner-text"></span>
    <button id="export-banner-btn" class="btn small primary">CSV 다운로드</button>
    <button id="export-banner-close" class="btn small">닫기</button>
  </div>

  <main>
    <section class="month-nav">
      <button id="prev-month" class="btn icon" aria-label="이전 달">‹</button>
      <h2 id="month-label"></h2>
      <button id="next-month" class="btn icon" aria-label="다음 달">›</button>
      <button id="today-btn" class="btn small">오늘</button>
    </section>

    <section class="summary">
      <div class="stat"><div class="stat-label">이번 달 총 지출</div><div id="sum-total" class="stat-value">0원</div></div>
      <div class="stat"><div class="stat-label"><span class="dot card"></span>삼성카드</div><div id="sum-card" class="stat-value">0원</div></div>
      <div class="stat"><div class="stat-label"><span class="dot cash"></span>현금·기타</div><div id="sum-cash" class="stat-value">0원</div></div>
      <div class="stat"><div class="stat-label">하루 평균</div><div id="sum-avg" class="stat-value">0원</div></div>
    </section>

    <section class="calendar-wrap">
      <div class="weekdays">
        <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>

    <section class="bottom">
      <div class="panel">
        <div class="panel-head">
          <h3 id="day-title">날짜를 선택하세요</h3>
          <button id="day-add" class="btn small" hidden>+ 이 날 추가</button>
        </div>
        <ul id="day-list" class="tx-list"></ul>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>카테고리별</h3></div>
        <ul id="cat-list" class="cat-list"></ul>
        <div class="panel-foot">
          <button id="btn-export" class="btn primary">이번 달 CSV 다운로드</button>
          <button id="btn-backup" class="btn small">전체 백업</button>
          <label class="btn small">백업 복원<input id="restore-file" type="file" accept=".json" hidden /></label>
        </div>
      </div>
    </section>
  </main>

  <!-- 지출 입력 -->
  <dialog id="tx-dialog">
    <form id="tx-form" method="dialog">
      <h3 id="tx-dialog-title">지출 입력</h3>
      <input type="hidden" name="id" />
      <label>날짜<input type="date" name="date" required /></label>
      <label>금액 (원)<input type="text" name="amount" inputmode="numeric" placeholder="예: 12000" required /></label>
      <label>내용<input type="text" name="merchant" placeholder="예: 점심, 편의점" required /></label>
      <label>카테고리<select name="category"></select></label>
      <label>결제수단
        <select name="method">
          <option value="현금">현금</option>
          <option value="계좌이체">계좌이체</option>
          <option value="삼성카드">삼성카드</option>
          <option value="기타카드">기타카드</option>
        </select>
      </label>
      <label>메모<input type="text" name="memo" placeholder="선택" /></label>
      <div class="dialog-actions">
        <button type="button" id="tx-delete" class="btn danger" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 삼성카드 불러오기 -->
  <dialog id="import-dialog">
    <div class="import-body">
      <h3>삼성카드 내역 불러오기</h3>
      <div class="tabs">
        <button class="tab active" data-tab="file">엑셀/CSV 파일</button>
        <button class="tab" data-tab="sms">승인 문자 붙여넣기</button>
      </div>
      <div class="tab-panel" data-panel="file">
        <p class="hint">삼성카드 홈페이지 또는 앱 → <b>이용내역 조회</b> → <b>엑셀 다운로드</b>로 받은 파일을 올리세요. (.xlsx, .xls, .csv)</p>
        <input id="import-file" type="file" accept=".xlsx,.xls,.csv" />
      </div>
      <div class="tab-panel" data-panel="sms" hidden>
        <p class="hint">삼성카드 승인 문자나 알림을 여러 개 한꺼번에 붙여넣어도 됩니다. 승인취소 문자는 해당 결제를 찾아 지워줍니다.</p>
        <textarea id="sms-text" rows="8" placeholder="[Web발신]
삼성1234승인
홍*동
12,300원 일시불
09/25 12:34 스타벅스
누적1,234,567원"></textarea>
        <button id="sms-parse" class="btn">분석하기</button>
      </div>
      <div id="import-preview" class="preview"></div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>닫기</button>
        <button type="button" id="import-confirm" class="btn primary" disabled>가져오기</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
